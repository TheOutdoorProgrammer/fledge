name: release

# The only way to cut a release. Quill works out the version, proves the build
# before it commits to a number, tags, publishes, and takes the tag back if any
# of that fails.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: What to cut
        type: choice
        default: Release
        options: [Release, Release Candidate]
      bump:
        description: Which part of the version to bump
        type: choice
        default: patch
        options: [patch, minor, major]
      dry-run:
        description: Build everything, publish nothing
        type: boolean
        default: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Quill reads the tag list to work out the next version, and the
          # default shallow checkout carries no tags at all.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: TheOutdoorProgrammer/quill@v1
        with:
          bump: ${{ inputs.bump }}
          scope: ${{ inputs.scope }}
          dry-run: ${{ inputs.dry-run }}
          publish: goreleaser, docker
          # A token scoped to the tap only. The job's own token cannot write to
          # another repository, so without this the cask is never updated.
          tap-app-id: ${{ secrets.TAP_APP_ID }}
          tap-private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          docker-sbom: "true"
          docker-provenance: mode=max
          docker-sign: "true"
          docker-attest: "true"
