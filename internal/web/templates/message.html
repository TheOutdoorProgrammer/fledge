{{define "title"}}{{.Heading}}{{end}}

{{define "body"}}
<div class="message-page">
  <div class="message-code">Flight interrupted</div>
  <h1>{{.Heading}}</h1>
  <p class="lede">{{.Detail}}</p>

  {{if .Notices}}
  <div class="notices">
    {{range .Notices}}
    <div class="notice {{.Level}}">
      <div>
        <strong>{{.Title}}</strong>{{.Body}}
        {{if .Action}}
        <form method="post" action="{{.Action}}" class="notice-action">
          <button type="submit">{{.ActionLabel}}</button>
        </form>
        {{end}}
      </div>
    </div>
    {{end}}
  </div>
  {{end}}

  {{if .BackLink}}<a class="button secondary back" href="{{.BackLink}}">{{.BackLabel}}</a>{{end}}
</div>
{{end}}
