version: 2

project_name: fledge

before:
  hooks:
    - go mod tidy

builds:
  - id: fledge
    main: ./cmd/fledge
    binary: fledge
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/theoutdoorprogrammer/fledge/internal/version.Version={{ .Version }}
      - -X github.com/theoutdoorprogrammer/fledge/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/theoutdoorprogrammer/fledge/internal/version.Date={{ .Date }}

archives:
  - id: fledge
    ids: [fledge]
    # The publish action fetches these by name, so the pattern is part of the
    # contract rather than cosmetic.
    name_template: "fledge_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

# Casks, not formulas: `brews` is hard-deprecated as of GoReleaser v2.16.
homebrew_casks:
  - name: fledge
    binaries: [fledge]
    # `auto` skips a prerelease, so a candidate never becomes what
    # `brew install fledge` gives you.
    skip_upload: auto
    repository:
      owner: TheOutdoorProgrammer
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/TheOutdoorProgrammer/fledge
    description: Release ad hoc iOS builds to your own devices
    # The binary is not signed or notarised, so Gatekeeper quarantines it and
    # the first run fails with "developer cannot be verified".
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine", "#{staged_path}/fledge"]
          end
    caveats: |
      Point it at a server and it reads the rest from fledge.yaml:

        export FLEDGE_URL=https://fledge.example
        export FLEDGE_TOKEN=...
        fledge release

      Building needs Xcode. Publishing an already-exported archive does not.

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  footer: |
    ## Publishing from CI

    ```yaml
    - uses: TheOutdoorProgrammer/fledge/actions/publish@v1
      with:
        server: ${{ "{{" }} secrets.FLEDGE_URL {{ "}}" }}
        secure: true
    ```
